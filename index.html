<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.cola</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; display: flex; flex-direction: column; gap: 15px; }
        input, button { padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        button { cursor: pointer; color: white; border: none; font-weight: bold; }
        .btn-encode { background: #e53935; }
        .btn-decode { background: #1e88e5; }
    </style>
</head>
<body>

<div class="container">
    <center><h1>.cola</h1></center>
    <input type="password" id="passInput" placeholder="Enter password">
    <input type="file" id="fileInput">
    <button class="btn-encode" id="encodeBtn">Encode</button>
    <button class="btn-decode" id="decodeBtn">Decode</button>
    <center>
    <iframe 
      src="https://codedroider.github.io/support-me/buttons_en?cola" 
      style="width: 360px; height: 160px; border: none; overflow: hidden; background: transparent;" 
      scrolling="no" 
      frameborder="0" 
      allowtransparency="true">
      error loading support-me!
    </iframe>
        <br>
    <iframe 
    src="https://codebanners.neocities.org/1banner?cola" 
    width="468" 
    height="80" 
    style="border: none; overflow: hidden;" 
    scrolling="no">
    error loading ad!
    </iframe>
    </center>
</div>

<script>
    
    // sorry, im lazy to use jsdelivr :>

    async function colaUse(file, password) {
        try {
            const fileBytes = await file.arrayBuffer();

            const base64String = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const rawBase64 = reader.result.split(',');
                    resolve(rawBase64[1] || rawBase64[0]);
                };
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(new Blob([fileBytes]));
            });

            const encoder = new TextEncoder();
            const dataToEncrypt = encoder.encode(base64String);

            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));

            const baseKey = await window.crypto.subtle.importKey(
                "raw",
                encoder.encode(password),
                { name: "PBKDF2" },
                false,
                ["deriveKey"]
            );

            const aesKey = await window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: 100000,
                    hash: "SHA-256"
                },
                baseKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt"]
            );

            const encryptedBytes = await window.crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv },
                aesKey,
                dataToEncrypt
            );

            const resultBuffer = new Uint8Array(salt.length + iv.length + encryptedBytes.byteLength);
            resultBuffer.set(salt, 0);
            resultBuffer.set(iv, salt.length);
            resultBuffer.set(new Uint8Array(encryptedBytes), salt.length + iv.length);

            const encryptedBlob = new Blob([resultBuffer], { type: "application/octet-stream" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(encryptedBlob);
            link.download = file.name + ".cola";
            link.click();
        } catch (error) {
            console.error(error);
            throw error;
        }
    }

    async function colaUsed(file, password) {
        try {
            const fileBytes = await file.arrayBuffer();
            const fullBuffer = new Uint8Array(fileBytes);

            const salt = fullBuffer.slice(0, 16);
            const iv = fullBuffer.slice(16, 16 + 12);
            const encryptedData = fullBuffer.slice(16 + 12);

            const encoder = new TextEncoder();
            const baseKey = await window.crypto.subtle.importKey(
                "raw",
                encoder.encode(password),
                { name: "PBKDF2" },
                false,
                ["deriveKey"]
            );

            const aesKey = await window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: 100000,
                    hash: "SHA-256"
                },
                baseKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );

            const decryptedBytes = await window.crypto.subtle.decrypt(
                { name: "AES-GCM", iv: iv },
                aesKey,
                encryptedData
            );

            const decoder = new TextDecoder();
            const base64String = decoder.decode(decryptedBytes);

            const response = await fetch(`data:application/octet-stream;base64,${base64String}`);
            const originalBlob = await response.blob();

            const originalName = file.name.replace(/\.cola$/, '');

            const link = document.createElement('a');
            link.href = URL.createObjectURL(originalBlob);
            link.download = originalName;
            link.click();
        } catch (error) {
            console.error(error);
            throw error;
        }
    }

    const passInput = document.getElementById('passInput');
    const fileInput = document.getElementById('fileInput');
    const encodeBtn = document.getElementById('encodeBtn');
    const decodeBtn = document.getElementById('decodeBtn');

    function getSelectedFile() {
        const files = fileInput.files;
        const pass = passInput.value;
        if (files.length === 0 || !pass) {
            alert("Please select a file and enter a password!");
            return null;
        }
        return { file: files[0], password: pass };
    }

    encodeBtn.addEventListener('click', async () => {
        const data = getSelectedFile();
        if (!data) return;
        try {
            await colaUse(data.file, data.password);
        } catch (error) {
            alert("Encoding Error: " + error.message);
        }
    });

    decodeBtn.addEventListener('click', async () => {
        const data = getSelectedFile();
        if (!data) return;
        try {
            await colaUsed(data.file, data.password);
        } catch (error) {
            alert("Decoding Error: " + error.message);
        }
    });
</script>

</body>
</html>
